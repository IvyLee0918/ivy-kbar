<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ivy 盤態</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:       #ffffff;
    --surface:  #f5f6f8;
    --border:   #d0d5de;
    --text:     #1a1d26;
    --muted:    #6b7280;
    --accent:   #1565c0;
    --up:       #c62828;
    --dn:       #00796b;
    --gold:     #e65100;
    --lime:     #33691e;
    --orange:   #e65100;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Pro Display', 'Helvetica Neue', sans-serif;
    font-size: 15px;
    min-height: 100vh;
  }

  /* ── 頂部 bar ── */
  #topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  #topbar select {
    flex: 1;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 16px;
    appearance: none;
  }
  #btn-load {
    background: var(--accent); color: #fff;
    border: none; border-radius: 6px;
    padding: 7px 14px; font-size: 15px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  #btn-load:active { opacity: 0.7; }

  /* ── 狀態訊息 ── */
  #status-bar {
    padding: 6px 12px;
    font-size: 13px; color: var(--muted);
    min-height: 24px;
    background: var(--bg);
  }
  #status-bar.err { color: #c62828; }

  /* ── 登入 ── */
  #login-section {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; padding: 60px 20px;
  }
  #login-section h2 { font-size: 20px; color: var(--accent); }
  #btn-signin {
    background: #fff; color: #333;
    border: 1px solid #d0d5de; border-radius: 8px;
    padding: 12px 24px; font-size: 17px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .google-icon { width: 18px; height: 18px; }

  /* ── 現價 ── */
  #price-display {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 8px 14px;
    display: none; align-items: center; gap: 10px;
  }
  #price-label { font-size: 13px; color: var(--muted); }
  #price-value {
    font-size: 28px; font-weight: 800;
    color: var(--orange);
    letter-spacing: 0.5px;
  }

  /* ── 行為表格 ── */
  #behavior-bar {
    background: var(--bg);
    border-bottom: 2px solid var(--border);
    padding: 8px 10px;
    display: none;
  }
  .beh-table {
    width: 100%; border-collapse: collapse;
    font-size: 14px;
  }
  .beh-table th {
    padding: 5px 8px;
    font-size: 15px; font-weight: 700;
    border-bottom: 2px solid var(--border);
    text-align: center;
  }
  .beh-table td {
    padding: 4px 8px;
    border-bottom: 1px solid #e8eaf0;
    vertical-align: top;
    font-size: 14px;
  }
  .beh-table tr:last-child td { border-bottom: none; }
  .th-t { color: #c62828; }
  .th-s { color: #1565c0; }
  .beh-curr-label { color: var(--muted); font-size: 13px; }
  .beh-curr-line  { color: #1565c0; font-weight: 700; font-size: 15px; }
  .beh-up   { color: #000; font-weight: 700; }
  .beh-dn   { color: #1b5e20; font-weight: 700; }
  .beh-last { background: #eeeeee; color: #555; border-radius: 3px; padding: 1px 5px; font-size: 13px; }
  .beh-price { color: #e65100; font-size: 13px; margin-left: 3px; }
  .zone-t { color: #c62828; font-weight: 700; }
  .zone-s { color: #1565c0; font-weight: 700; }

  /* ── K 線圖區 ── */
  #chart-area {
    padding: 4px 8px 80px;
    display: none;
    background: var(--bg);
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .chart-title {
    padding: 6px 10px;
    font-size: 14px; color: #111111; font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between;
    background: #eef2ff;
  }
  .chart-canvas-wrap {
    display: flex; height: 340px; background: #fff;
  }
  .chart-canvas-inner {
    position: relative; flex: 1; min-width: 0;
  }
  canvas { width: 100% !important; height: 100% !important; }
  .price-axis {
    width: 44px; flex-shrink: 0;
    position: relative;
    background: #f8f9fc;
    border-left: 1px solid #dde;
    font-size: 11px; color: #333;
    overflow: hidden;
  }
  .price-tick { white-space: nowrap; line-height: 1.2; }
  .price-tick.tick-half   { color: #c62828; font-weight: 700; }
  .price-tick.tick-third  { color: #444; font-weight: 700; }
  .price-tick.tick-edge   { color: #1565c0; font-weight: 700; }
  .price-tick.tick-target-up { color: #e65100; font-weight: 700; background: #fff3e0; border-radius: 2px; padding: 0 2px; }
  .price-tick.tick-target-dn { color: #1b5e20; font-weight: 700; background: #f1f8e9; border-radius: 2px; padding: 0 2px; }

  /* ── 載入動畫 ── */
  #loading {
    display: none;
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.9);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    z-index: 999;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-msg { color: var(--muted); font-size: 14px; }

  /* ── Tab 切換 ── */
  #tf-tabs {
    display: flex; gap: 4px;
    padding: 6px 12px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: none;
  }
  .tf-tab {
    padding: 5px 12px; border-radius: 5px 5px 0 0;
    font-size: 14px; cursor: pointer;
    color: var(--muted); background: transparent; border: none;
  }
  .tf-tab.active { background: var(--bg); color: var(--accent); font-weight: 700; border-top: 2px solid var(--accent); }
</style>
</head>
<body>

<!-- 登入頁 -->
<div id="login-section">
  <h2>📊 Ivy 盤態檢視器</h2>
  <p style="color:var(--muted);text-align:center;line-height:1.6">
    從 Google Drive 讀取<br>K 線圖 + 格線 + 區間行為
  </p>
  <button class="btn-signin" id="btn-signin" onclick="handleSignIn()">
    <svg class="google-icon" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
      <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/>
    </svg>
    使用 Google 帳號登入
  </button>
</div>

<!-- 主介面（登入後顯示） -->
<div id="main-ui" style="display:none">
  <div id="topbar">
    <select id="sym-select" onchange="onSymbolChange()">
      <option value="">— 選擇股票 —</option>
    </select>
    <button id="btn-load" onclick="loadSymbol()">載入</button>
  </div>
  <div id="status-bar">準備就緒</div>
  <div id="price-display">
    <span id="price-label">現價</span>
    <span id="price-value">—</span>
  </div>
  <div id="tf-tabs">
    <button class="tf-tab active" onclick="switchTF('1D','日K')">日K</button>
    <button class="tf-tab" onclick="switchTF('30min','30分K')">30分K</button>
    <button class="tf-tab" onclick="switchTF('5min','5分K')">5分K</button>
  </div>
  <div id="behavior-bar"></div>
  <div id="chart-area"></div>
</div>

<!-- 載入動畫 -->
<div id="loading">
  <div class="spinner"></div>
  <div id="loading-msg">連接 Google Drive…</div>
</div>

<script>
// ═══════════════════════════════════════════════════
// 設定
// ═══════════════════════════════════════════════════
const CLIENT_ID   = '298194095133-phtnomlmc73hej2bat5a38r7132cqmgh.apps.googleusercontent.com';
const SCOPES      = 'https://www.googleapis.com/auth/drive.readonly';
const APPROX_RATIO = 0.833;

// Drive 資料夾 ID（固定寫死，不靠名稱搜尋）
const FOLDER_IDS = {
  kbar:          '1wPdF8MTHA0tLwxIMwqjnrP_qCAQFs3Ot',  // KBar/
  structure:     '1N6sZJ7qA6xcOl2wA42fu4buflXWcXfGW',  // 2026_structure/
  settings: null,  // 初始化時動態找
};

// ═══════════════════════════════════════════════════
// 全域狀態
// ═══════════════════════════════════════════════════
let tokenClient, accessToken = null;
let sqlDb = null;
let behaviorState = {};
let settingsAll   = {};
let currentSymbol = '';
let currentTF     = '1D';
let chartInstances = [];
let fileIdCache   = {};  // path → fileId

// ═══════════════════════════════════════════════════
// Google Identity Services
// ═══════════════════════════════════════════════════
function loadGIS() {
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: onTokenReceived,
    });
  };
  document.head.appendChild(s);
}

function handleSignIn() {
  if (!tokenClient) { setStatus('GIS 尚未載入，請稍候再試', true); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function onTokenReceived(resp) {
  if (resp.error) { setStatus('登入失敗: ' + resp.error, true); return; }
  accessToken = resp.access_token;
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('main-ui').style.display = 'block';
  initApp();
}

// ═══════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════
async function initApp() {
  showLoading('初始化 SQLite…');
  try {
    const SQL = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`
    });

    setLoadingMsg('下載 kbar.db…（首次約 5–10 秒）');
    const kbarFileId = await driveGetFileInFolder(FOLDER_IDS.kbar, 'kbar.db');
    const dbBuf = await driveDownload(kbarFileId);
    sqlDb = new SQL.Database(new Uint8Array(dbBuf));

    setLoadingMsg('讀取 behavior_state…');
    const behFileId = await driveGetFileInFolder(FOLDER_IDS.structure, 'behavior_state.json');
    const behBuf = await driveDownload(behFileId);
    behaviorState = JSON.parse(new TextDecoder().decode(behBuf));

    setLoadingMsg('讀取 settings…');
    await loadAllSettings();

    populateSymbolSelect();
    document.getElementById('tf-tabs').style.display = 'flex';
    hideLoading();
  } catch(e) {
    hideLoading();
    setStatus('初始化失敗: ' + e.message, true);
    console.error(e);
  }
}

// ═══════════════════════════════════════════════════
// Google Drive API（用固定 ID，不靠名稱搜尋）
// ═══════════════════════════════════════════════════

// 直接用資料夾 ID 找檔案
async function driveGetFileInFolder(folderId, fileName) {
  const cacheKey = `${folderId}/${fileName}`;
  if (fileIdCache[cacheKey]) return fileIdCache[cacheKey];
  const q = `name='${fileName}' and '${folderId}' in parents and trashed=false`;
  const r = await driveQuery(q);
  if (!r.files.length) throw new Error(`檔案 ${fileName} 找不到`);
  fileIdCache[cacheKey] = r.files[0].id;
  return r.files[0].id;
}

async function driveQuery(q) {
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`;
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
  if (!r.ok) throw new Error('Drive API 錯誤 ' + r.status);
  return r.json();
}

async function driveDownload(fileId) {
  const r = await fetch(
    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    { headers: { Authorization: 'Bearer ' + accessToken } }
  );
  if (!r.ok) throw new Error('下載失敗 ' + r.status);
  return r.arrayBuffer();
}

async function driveListFiles(folderId) {
  const q = `'${folderId}' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'`;
  const r = await driveQuery(q);
  return r.files;
}

async function loadAllSettings() {
  // 用固定 ID 找 settings 子資料夾
  const settingsR = await driveQuery(
    `name='settings' and mimeType='application/vnd.google-apps.folder' and '${FOLDER_IDS.structure}' in parents and trashed=false`
  );
  if (!settingsR.files.length) throw new Error('找不到 settings 資料夾');
  const settingsFolderId = settingsR.files[0].id;

  // 列出所有 JSON 並行下載
  const files = await driveListFiles(settingsFolderId);
  const promises = files
    .filter(f => f.name.endsWith('.json') && f.name !== '__recent__.json')
    .map(async f => {
      const buf = await driveDownload(f.id);
      const text = new TextDecoder().decode(buf);
      const sym = f.name.replace('.json', '');
      try { settingsAll[sym] = JSON.parse(text); } catch(e) {}
    });
  await Promise.all(promises);
}

// ═══════════════════════════════════════════════════
// 股票選單
// ═══════════════════════════════════════════════════
function populateSymbolSelect() {
  const sel = document.getElementById('sym-select');
  const symbols = Object.keys(settingsAll).sort();

  // 取得最近使用的股票（從 behavior_state）
  const recent = Object.keys(behaviorState).filter(k => k !== '_meta').slice(0, 5);

  symbols.forEach(sym => {
    const opt = document.createElement('option');
    opt.value = sym;
    const beh = behaviorState[sym];
    const meta = beh && beh._meta;
    const bestDiv = meta && meta.best_div;
    opt.textContent = `${sym}${bestDiv ? '  ('+bestDiv+'等份)' : ''}`;
    sel.appendChild(opt);
  });

  if (recent.length) {
    const val = recent[0];
    if (symbols.includes(val)) sel.value = val;
  }
}

function onSymbolChange() {
  currentSymbol = document.getElementById('sym-select').value;
}

// ═══════════════════════════════════════════════════
// 載入股票
// ═══════════════════════════════════════════════════
async function loadSymbol() {
  const sym = document.getElementById('sym-select').value;
  if (!sym) { setStatus('請先選擇股票', true); return; }
  currentSymbol = sym;
  await renderAll();
}

function switchTF(tf, label) {
  currentTF = tf;
  document.querySelectorAll('.tf-tab').forEach((t,i) => {
    t.classList.toggle('active', ['1D','5min','30min'][i] === tf);
  });
  if (currentSymbol) renderAll();
}

async function renderAll() {
  if (!currentSymbol || !sqlDb) return;
  showLoading('繪製圖表中…');
  try {
    // 現價
    const lp = getLastPrice(currentSymbol);
    const priceEl = document.getElementById('price-value');
    const priceDisp = document.getElementById('price-display');
    if (lp != null) {
      priceEl.textContent = fmt(lp);
      priceDisp.style.display = 'flex';
    }
    renderBehaviorBar(currentSymbol);
    await renderCharts(currentSymbol);
    document.getElementById('behavior-bar').style.display = 'block';
    document.getElementById('chart-area').style.display = 'block';
    hideLoading();
    setStatus(`${currentSymbol}  ${currentTF}  ${new Date().toLocaleTimeString('zh-TW')}`);
  } catch(e) {
    hideLoading();
    setStatus('繪製失敗: ' + e.message, true);
    console.error(e);
  }
}

// ═══════════════════════════════════════════════════
// 行為列渲染
// ═══════════════════════════════════════════════════
function renderBehaviorBar(sym) {
  const bar = document.getElementById('behavior-bar');
  const symBeh = behaviorState[sym] || {};
  const bestDiv = (symBeh._meta || {}).best_div || '16';

  // 只顯示 bestDiv 的 T / S
  const tKey = `g0_d${bestDiv}_T`;
  const sKey = `g0_d${bestDiv}_S`;
  const tBeh = symBeh[tKey] || {};
  const sBeh = symBeh[sKey] || {};

  function cellHtml(beh) {
    const cl  = beh.current_line || '—';
    const nu  = beh.next_up || '';
    const nd  = beh.next_dn || '';
    const nuUp = beh.next_up_approx_up;
    const nuDn = beh.next_up_approx_dn;
    const ndUp = beh.next_dn_approx_up;
    const ndDn = beh.next_dn_approx_dn;
    const le   = beh.last_event || '';
    const leb  = beh.last_event_bar ? beh.last_event_bar.slice(11,16) : '';

    let h = `<span class="beh-curr-label">當前</span> <span class="beh-curr-line">${cl}</span><br>`;
    if (nu) {
      const p = (nuUp!=null&&nuDn!=null) ? `<span class="beh-price">(${fmt(nuUp)} ${fmt(nuDn)})</span>` : '';
      h += `<span class="beh-up">${nu}</span>${p}<br>`;
    }
    if (nd) {
      const p = (ndUp!=null&&ndDn!=null) ? `<span class="beh-price">(${fmt(ndUp)} ${fmt(ndDn)})</span>` : '';
      h += `<span class="beh-dn">${nd}</span>${p}<br>`;
    }
    if (le) {
      h += `<span class="beh-curr-label">上次</span> <span class="beh-last">${le}</span>`;
      if (leb) h += ` <span class="beh-price">${leb}</span>`;
    }
    return h;
  }

  bar.innerHTML = `
    <table class="beh-table">
      <thead><tr>
        <th class="th-t">T${bestDiv}</th>
        <th class="th-s">S${bestDiv}</th>
      </tr></thead>
      <tbody><tr>
        <td>${cellHtml(tBeh)}</td>
        <td>${cellHtml(sBeh)}</td>
      </tr></tbody>
    </table>`;
}

function getLastPrice(sym) {
  if (!sqlDb) return null;
  try {
    const res = sqlDb.exec(
      `SELECT Close FROM kbar_1min WHERE symbol=? ORDER BY ts DESC LIMIT 1`,
      [sym]
    );
    if (res.length && res[0].values.length) return res[0].values[0][0];
    const res2 = sqlDb.exec(
      `SELECT Close FROM kbar_daily WHERE symbol=? ORDER BY ts DESC LIMIT 1`,
      [sym]
    );
    return res2.length && res2[0].values.length ? res2[0].values[0][0] : null;
  } catch(e) { return null; }
}

// ═══════════════════════════════════════════════════
// K 線圖渲染
// ═══════════════════════════════════════════════════
async function renderCharts(sym) {
  // 清除舊圖
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];
  const area = document.getElementById('chart-area');
  area.innerHTML = '';

  const s = settingsAll[sym] || {};
  const gh = parseFloat(s.g0_high);
  const gl = parseFloat(s.g0_low);
  if (!gh || !gl) { setStatus(`${sym} 尚未設定 High/Low`, true); return; }

  // 讀 K 棒
  const bars = queryBars(sym, currentTF);
  if (!bars.length) { setStatus(`${sym} 無 ${currentTF} K 棒資料`); return; }

  const symBeh = behaviorState[sym] || {};
  const bestDiv = (symBeh._meta || {}).best_div || '16';

  for (const div of [12, 16]) {
    const struct = calcStructure(gh, gl, div);

    for (const zoneType of ['T', 'S']) {
      const layer = zoneType === 'T' ? struct.sub3 : struct.sub6;
      const bkey  = `g0_d${div}_${zoneType}`;
      const beh   = symBeh[bkey] || {};

      // 取當前區間 top/bottom
      const timeline = beh.zone_timeline || (s[`g0_d${div}_b${zoneType==='T'?0:1}`] || {})._checkpoint?.zone_timeline || [];
      const activeSeg = [...timeline].reverse().find(seg => !seg.valid_until) || {};
      const zTop = parseFloat(activeSeg.top || beh.zone_top || 0);
      const zBot = parseFloat(activeSeg.bottom || beh.zone_bottom || 0);

      // 格線
      const gridLines = buildGridLines(gh, gl, div, layer, zTop, zBot);

      const isBestDiv = String(div) === String(bestDiv);
      const card = buildChartCard(sym, div, zoneType, bars, gridLines, beh, isBestDiv);
      area.appendChild(card.el);
      chartInstances.push(card.chart);
    }
  }
}

function queryBars(sym, tf) {
  try {
    if (tf === '30min') {
      // 從 1分K resample 成 30分K（closed=right, label=right）
      const res = sqlDb.exec(
        `SELECT ts, Open, High, Low, Close, Volume FROM kbar_1min
         WHERE symbol=? ORDER BY ts ASC`,
        [sym]
      );
      if (!res.length) return [];
      const raw = res[0].values.map(r => ({
        ts: r[0], open: r[1], high: r[2], low: r[3], close: r[4], volume: r[5]
      }));
      return resampleNmin(raw, 30).slice(-120);
    }
    if (tf === '5min') {
      const res = sqlDb.exec(
        `SELECT ts, Open, High, Low, Close, Volume FROM kbar_1min
         WHERE symbol=? ORDER BY ts ASC`,
        [sym]
      );
      if (!res.length) return [];
      const raw = res[0].values.map(r => ({
        ts: r[0], open: r[1], high: r[2], low: r[3], close: r[4], volume: r[5]
      }));
      return resampleNmin(raw, 5).slice(-160);
    }
    const table = tf === '1D' ? 'kbar_daily' : 'kbar_1min';
    const limit  = tf === '1D' ? 120 : 240;
    const res = sqlDb.exec(
      `SELECT ts, Open, High, Low, Close, Volume FROM ${table}
       WHERE symbol=? ORDER BY ts DESC LIMIT ${limit}`,
      [sym]
    );
    if (!res.length) return [];
    return res[0].values.map(r => ({
      ts: r[0], open: r[1], high: r[2], low: r[3], close: r[4], volume: r[5]
    })).reverse();
  } catch(e) { console.error(e); return []; }
}

// N分K resample（closed=right, label=right，台股標準）
// 例：5分K → 09:05 涵蓋 09:01~09:05
function resampleNmin(bars, n) {
  const buckets = {};
  bars.forEach(b => {
    const d = new Date(b.ts);
    const mins = d.getMinutes();
    // 右閉：ceil 到下一個 n 的倍數
    const roundedMins = Math.ceil((mins + 1) / n) * n;
    const aligned = new Date(d);
    if (roundedMins >= 60) {
      aligned.setMinutes(roundedMins - 60);
      aligned.setHours(d.getHours() + 1);
    } else {
      aligned.setMinutes(roundedMins);
    }
    aligned.setSeconds(0); aligned.setMilliseconds(0);
    const key = aligned.toISOString();
    if (!buckets[key]) {
      buckets[key] = { ts: b.ts, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume, _label: key };
    } else {
      buckets[key].high   = Math.max(buckets[key].high, b.high);
      buckets[key].low    = Math.min(buckets[key].low,  b.low);
      buckets[key].close  = b.close;
      buckets[key].volume += b.volume;
    }
  });
  return Object.values(buckets)
    .sort((a,b) => a._label.localeCompare(b._label))
    .filter(b => b.volume > 0);
}

// ═══════════════════════════════════════════════════
// Chart.js K 線圖
// ═══════════════════════════════════════════════════
function buildChartCard(sym, div, zoneType, bars, gridLines, beh, isBestDiv) {
  const el = document.createElement('div');
  el.className = 'chart-card';

  const dir = beh.zone_direction || '—';
  const dirSign = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '';
  const star = isBestDiv ? ' ★' : '';
  el.innerHTML = `
    <div class="chart-title">
      <span>${sym}  ${div}等份  <span class="${zoneType==='T'?'zone-t':'zone-s'}">${zoneType}</span>${star}</span>
      <span>${dirSign} ${beh.current_line || ''}</span>
    </div>
    <div class="chart-canvas-wrap">
      <div class="chart-canvas-inner">
        <canvas id="cv-${div}-${zoneType}"></canvas>
      </div>
      <div class="price-axis" id="pa-${div}-${zoneType}"></div>
    </div>`;

  // 等 DOM 插入後再建 Chart
  setTimeout(() => {
    const canvas = el.querySelector('canvas');
    if (!canvas) return;
    const chart = buildCandlestickChart(canvas, bars, gridLines, beh);
    chartInstances.push(chart);
    // 建完後填右側價格軸
    setTimeout(() => fillPriceAxis(el, chart, gridLines, beh), 80);
  }, 0);

  // 回傳假 chart（真正的在 setTimeout 裡建）
  return { el, chart: { destroy: () => {} } };
}

// 填右側價格軸標籤
function fillPriceAxis(cardEl, chart, gridLines, beh) {
  const axisEl = cardEl.querySelector('.price-axis');
  if (!axisEl || !chart || !chart.scales || !chart.scales.y) return;

  const yScale = chart.scales.y;
  const minY = yScale.min;
  const maxY = yScale.max;
  const range = maxY - minY;
  if (!range) return;

  // 收集目標線價格
  const targetUp = beh.next_up_approx_dn;
  const targetDn = beh.next_dn_approx_up;

  // 過濾在範圍內的格線，只顯示有意義的（主格線 + 特殊線 + 目標線）
  const ticks = [];

  // 從 gridLines 挑出要顯示的：是 edge/half/third，或在區間內有標籤的
  const priceRange = Math.max(...gridLines.map(g=>g.price)) - Math.min(...gridLines.map(g=>g.price));
  const half   = Math.min(...gridLines.map(g=>g.price)) + priceRange / 2;
  const tol    = priceRange * 0.001;

  gridLines.forEach(g => {
    if (g.price < minY || g.price > maxY) return;
    const isHalf  = Math.abs(g.price - half) < tol;
    const isEdge  = g.width >= 1 && g.dash && g.dash.length === 0 && !isHalf;
    const hasLbl  = !!g.label;
    if (isHalf || isEdge || hasLbl) {
      let cls = 'price-tick';
      if (isHalf) cls += ' tick-half';
      else if (isEdge) cls += ' tick-third';
      ticks.push({ price: g.price, cls });
    }
  });

  // 加目標線
  if (targetUp && targetUp >= minY && targetUp <= maxY) {
    ticks.push({ price: targetUp, cls: 'price-tick tick-target-up', label: beh.next_up ? beh.next_up : null });
  }
  if (targetDn && targetDn >= minY && targetDn <= maxY) {
    ticks.push({ price: targetDn, cls: 'price-tick tick-target-dn', label: beh.next_dn ? beh.next_dn : null });
  }

  // 排序（高→低）並去重
  const seen = new Set();
  const sorted = ticks
    .filter(t => { const k = t.price.toFixed(1); if(seen.has(k)) return false; seen.add(k); return true; })
    .sort((a,b) => b.price - a.price);

  // 用絕對定位方式放置（根據 Y 軸比例計算位置）
  axisEl.style.position = 'relative';
  axisEl.innerHTML = '';
  const axisH = axisEl.offsetHeight || 340;

  sorted.forEach(t => {
    const pct = (maxY - t.price) / range;
    const top = pct * axisH;
    const div = document.createElement('div');
    div.className = t.cls;
    div.style.position  = 'absolute';
    div.style.right     = '3px';
    div.style.top       = `${top - 7}px`;
    div.style.fontSize  = '11px';
    const displayTxt = t.label ? t.label : t.price.toFixed(1);
    div.textContent = displayTxt;
    axisEl.appendChild(div);
  });
}

function buildCandlestickChart(canvas, bars, gridLines, beh) {
  const labels = bars.map(b => {
    const d = new Date(b.ts);
    if (currentTF === '1D') return `${d.getMonth()+1}/${d.getDate()}`;
    return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  });

  // 用 Chart.js Bar chart 模擬 K 線（每根包含 open/close 實體 + high/low 影線）
  const ctx = canvas.getContext('2d');

  // 價格範圍
  const allHigh = Math.max(...bars.map(b=>b.high));
  const allLow  = Math.min(...bars.map(b=>b.low));
  const pad = (allHigh - allLow) * 0.08;

  // 格線 annotation（用 Plugin 手動畫）
  const gridPlugin = {
    id: 'gridLines',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const yScale = scales.y;
      ctx.save();
      gridLines.forEach(g => {
        const y = yScale.getPixelForValue(g.price);
        if (y < chartArea.top || y > chartArea.bottom) return;
        ctx.beginPath();
        ctx.moveTo(chartArea.left, y);
        ctx.lineTo(chartArea.right, y);
        ctx.strokeStyle = g.color;
        ctx.lineWidth   = g.width;
        ctx.setLineDash(g.dash);
        ctx.stroke();
        ctx.setLineDash([]);

        // 標籤
        if (g.label) {
          ctx.fillStyle = g.labelColor || '#444444';
          ctx.font = '10px monospace';
          ctx.textAlign = 'right';
          ctx.fillText(g.label, chartArea.right - 2, y - 2);
        }
      });

      // 行為目標線高亮
      const now = beh.next_up_approx_dn;
      const ndn = beh.next_dn_approx_up;
      // 往上：橘色線；往下：藍綠色線（白底可見）
      [[now, '#e65100', '#fff3e0', beh.next_up], [ndn, '#1b5e20', '#f1f8e9', beh.next_dn]].forEach(([price, lineColor, bgColor, name]) => {
        if (!price) return;
        const y = yScale.getPixelForValue(price);
        if (y < chartArea.top || y > chartArea.bottom) return;
        // 虛線
        ctx.beginPath();
        ctx.moveTo(chartArea.left, y);
        ctx.lineTo(chartArea.right, y);
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 2;
        ctx.setLineDash([6,3]);
        ctx.stroke();
        ctx.setLineDash([]);
        // 標籤：白底框 + 深色字
        if (name) {
          ctx.font = 'bold 12px sans-serif';
          const tw = ctx.measureText(name).width;
          const px = chartArea.left + 6;
          const py = y - 14;
          // 背景框
          ctx.fillStyle = bgColor;
          ctx.strokeStyle = lineColor;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(px - 2, py, tw + 6, 14, 2)
                        : ctx.rect(px - 2, py, tw + 6, 14);
          ctx.fill();
          ctx.stroke();
          // 文字
          ctx.fillStyle = lineColor;
          ctx.textAlign = 'left';
          ctx.fillText(name, px + 1, py + 11);
        }
      });

      ctx.restore();
    }
  };

  // K 棒 Plugin（手動繪製 candlestick）
  const candlePlugin = {
    id: 'candle',
    afterDatasetsDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const xScale = scales.x;
      const yScale = scales.y;
      ctx.save();
      const n = bars.length;
      const barW = Math.max(2, (chartArea.width / n) * 0.6);

      bars.forEach((b, i) => {
        const x  = xScale.getPixelForValue(i);
        const yO = yScale.getPixelForValue(b.open);
        const yC = yScale.getPixelForValue(b.close);
        const yH = yScale.getPixelForValue(b.high);
        const yL = yScale.getPixelForValue(b.low);
        const isUp = b.close >= b.open;
        const color = isUp ? '#c62828' : '#2e7d32';

        // 影線
        ctx.beginPath();
        ctx.moveTo(x, yH);
        ctx.lineTo(x, yL);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.stroke();

        // 實體
        const top = Math.min(yO, yC);
        const ht  = Math.max(1, Math.abs(yO - yC));
        ctx.fillStyle = color;
        ctx.fillRect(x - barW/2, top, barW, ht);
      });
      ctx.restore();
    }
  };

  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: bars.map(b => (b.high + b.low) / 2),
        borderColor: 'transparent',
        pointRadius: 0,
        fill: false,
      }]
    },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { right: 56 } },
      scales: {
        x: {
          ticks: { color: '#555555', font: { size: 10 }, maxTicksLimit: 8 },
          grid: { color: '#e8eaf0' },
        },
        y: {
          position: 'right',
          min: allLow - pad,
          max: allHigh + pad,
          display: false,
          grid: { color: '#e8eaf0', drawTicks: false },
        }
      },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
    },
    plugins: [gridPlugin, candlePlugin],
  });

  return chart;
}

// ═══════════════════════════════════════════════════
// 格線計算（移植自 structure_calculation.py）
// ═══════════════════════════════════════════════════
function rdFloor(v) {
  // round_down：無條件捨去到小數點後1位
  return Math.floor(parseFloat(v) * 10) / 10;
}
function rd(v) {
  return rdFloor(Math.round(parseFloat(v) * 100) / 100);
}
function approxUp(val, upper) { return rd(upper - (upper - val) * APPROX_RATIO); }
function approxDn(lower, val) { return rd(lower + (val - lower) * APPROX_RATIO); }

function buildLayer(vLow, vHigh, nDiv) {
  const step = (vHigh - vLow) / nDiv;
  const items = [];
  for (let i = 0; i <= nDiv; i++) {
    items.push({ value: rd(vLow + step * i), index: i, approx_up: null, approx_dn: null });
  }
  for (let j = 0; j < items.length - 1; j++) {
    const lo = items[j].value, hi = items[j+1].value;
    items[j].approx_up    = approxUp(lo, hi);
    items[j+1].approx_dn  = approxDn(lo, hi);
  }
  return items;
}

function calcStructure(vHigh, vLow, divisions) {
  if (vHigh <= vLow) return { main: [], sub3: [], sub6: [] };
  return {
    main: buildLayer(vLow, vHigh, divisions),
    sub3: buildLayer(vLow, vHigh, divisions * 3),
    sub6: buildLayer(vLow, vHigh, divisions * 6),
  };
}

function buildGridLines(gh, gl, div, layer, zTop, zBot) {
  const priceRange = gh - gl;
  const tol = priceRange * 0.0001;
  const half   = gl + priceRange / 2;
  const third1 = gl + priceRange / 3;
  const third2 = gl + priceRange * 2 / 3;
  // 格線統一用淺灰（白底背景下藍/紫太搶眼）
  // 特殊線（半線/三分線）仍保留深色
  const isMain = ['rgba(160,160,160,0.6)', 'rgba(140,140,140,0.5)', 'rgba(180,180,180,0.35)'];

  return layer.map(item => {
    const p = item.value;
    let color = isMain[2], width = 1, dash = [2, 3], label = null, labelColor = null;
    const isHalf   = Math.abs(p - half)   < tol;
    const isThird  = Math.abs(p - third1) < tol || Math.abs(p - third2) < tol;
    const isEdge   = p === rd(gh) || p === rd(gl);

    if (isHalf)  { color = 'rgba(180,30,30,0.75)'; width = 1.5; dash = []; }
    else if (isThird) { color = 'rgba(80,80,80,0.8)'; width = 1.2; dash = []; }
    else if (isEdge)  { color = isMain[0]; width = 1; dash = []; }

    // 在區間範圍內的線加標籤
    if (zTop && zBot && p >= zBot * 0.999 && p <= zTop * 1.001) {
      label = p.toFixed(1);
      labelColor = '#444444';
    }

    return { price: p, color, width, dash, label, labelColor };
  });
}

// UI 工具
// ═══════════════════════════════════════════════════
function fmt(v) {
  if (v == null) return '—';
  const f = parseFloat(v);
  return f === Math.floor(f) ? f.toFixed(0) : f.toFixed(1);
}
function setStatus(msg, isErr) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}
function showLoading(msg) {
  document.getElementById('loading').classList.add('show');
  setLoadingMsg(msg);
}
function setLoadingMsg(msg) {
  document.getElementById('loading-msg').textContent = msg;
}
function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}
