<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ivy 盤態</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#fff; --surface:#f5f6f8; --border:#d0d5de;
  --text:#1a1d26; --muted:#6b7280; --accent:#1565c0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',sans-serif;font-size:15px;}
#topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;}
#topbar select{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:16px;}
#btn-load{background:#1565c0;color:#fff;border:none;border-radius:6px;padding:7px 16px;font-size:15px;font-weight:600;cursor:pointer;}
#status-bar{padding:5px 12px;font-size:13px;color:var(--muted);background:var(--bg);}
#status-bar.err{color:#c62828;}
#login-section{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 20px;}
#login-section h2{font-size:20px;color:#1565c0;}
#btn-signin{background:#fff;color:#333;border:1px solid #d0d5de;border-radius:8px;padding:12px 24px;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.12);}
#price-display{background:var(--surface);border-bottom:2px solid var(--border);padding:6px 14px;display:none;align-items:center;gap:8px;}
#price-label{font-size:13px;color:var(--muted);}
#price-value{font-size:24px;font-weight:800;color:#e65100;}
#tf-tabs{display:none;gap:4px;padding:6px 12px 0;border-bottom:1px solid var(--border);background:var(--surface);}
.tf-tab{padding:5px 14px;border-radius:5px 5px 0 0;font-size:14px;cursor:pointer;color:var(--muted);background:transparent;border:none;}
.tf-tab.active{background:var(--bg);color:#1565c0;font-weight:700;border-top:2px solid #1565c0;}
#behavior-bar{background:var(--bg);border-bottom:2px solid var(--border);padding:8px 10px;display:none;}
.beh-table{width:100%;border-collapse:collapse;font-size:14px;}
.beh-table th{padding:5px 8px;font-size:15px;font-weight:700;border-bottom:2px solid var(--border);text-align:center;}
.beh-table td{padding:4px 8px;border-bottom:1px solid #e8eaf0;vertical-align:top;}
.th-t{color:#c62828;} .th-s{color:#1565c0;}
.beh-curr-label{color:var(--muted);font-size:13px;}
.beh-curr-line{color:#1565c0;font-weight:700;font-size:15px;}
.beh-up{color:#000;font-weight:700;}
.beh-dn{color:#1b5e20;font-weight:700;}
.beh-last{background:#eee;color:#555;border-radius:3px;padding:1px 5px;font-size:13px;}
.beh-price{color:#e65100;font-size:13px;margin-left:3px;}
#chart-area{padding:4px 8px 80px;display:none;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;}
.chart-title{padding:6px 10px;font-size:14px;color:#111;font-weight:600;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;background:#eef2ff;}
.zone-t{color:#c62828;font-weight:700;} .zone-s{color:#1565c0;font-weight:700;}
.chart-body{display:flex;height:340px;background:#fff;}
.chart-inner{position:relative;flex:1;min-width:0;}
.chart-inner canvas{width:100%!important;height:100%!important;}
.price-axis{width:52px;flex-shrink:0;position:relative;background:#f8f9fc;border-left:1px solid #dde;overflow:hidden;align-self:stretch;}
.price-axis .tick{position:absolute;left:3px;right:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#333;font-family:monospace;transform:translateY(-50%);line-height:1;}
.price-axis .tick.half{color:#c62828;font-weight:700;}
.price-axis .tick.edge{color:#1565c0;font-weight:600;}

#loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,.9);align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999;}
#loading.show{display:flex;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:#1565c0;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading-msg{color:var(--muted);font-size:14px;}
</style>
</head>
<body>
<div id="login-section">
  <h2>📊 Ivy 盤態檢視器</h2>
  <p style="color:#6b7280;text-align:center;line-height:1.6">從 Google Drive 讀取<br>K 線圖 + 格線 + 區間行為</p>
  <button id="btn-signin" onclick="handleSignIn()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
    使用 Google 帳號登入
  </button>
</div>
<div id="main-ui" style="display:none">
  <div id="topbar">
    <select id="sym-select" onchange="onSymbolChange()"><option value="">— 選擇股票 —</option></select>
    <button id="btn-load" onclick="loadSymbol()">載入</button>
  </div>
  <div id="status-bar">準備就緒</div>
  <div id="price-display"><span id="price-label">現價</span><span id="price-value">—</span></div>
  <div id="tf-tabs" style="display:flex">
    <button class="tf-tab active" onclick="switchTF('1D')">日K</button>
    <button class="tf-tab" onclick="switchTF('30min')">30分K</button>
    <button class="tf-tab" onclick="switchTF('5min')">5分K</button>
  </div>
  <div id="behavior-bar"></div>
  <div id="chart-area"></div>
</div>
<div id="loading"><div class="spinner"></div><div id="loading-msg">連接中…</div></div>
<script>
const CLIENT_ID='298194095133-phtnomlmc73hej2bat5a38r7132cqmgh.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.readonly';
const FOLDER_IDS={kbar:'1wPdF8MTHA0tLwxIMwqjnrP_qCAQFs3Ot',structure:'1N6sZJ7qA6xcOl2wA42fu4buflXWcXfGW'};
const APPROX_RATIO=0.833;
let tokenClient,accessToken=null,sqlDb=null,behaviorState={},settingsAll={};
let currentSymbol='',currentTF='1D',chartInst=[],fileCache={};

// ── Google ──
function loadGIS(){const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:onToken});};document.head.appendChild(s);}
function handleSignIn(){if(!tokenClient){setStatus('GIS 尚未載入',true);return;}tokenClient.requestAccessToken({prompt:'consent'});}
function onToken(r){if(r.error){setStatus('登入失敗:'+r.error,true);return;}accessToken=r.access_token;document.getElementById('login-section').style.display='none';document.getElementById('main-ui').style.display='block';initApp();}

// ── Drive ──
async function driveQuery(q){const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name)',{headers:{Authorization:'Bearer '+accessToken}});if(!r.ok)throw new Error('Drive '+r.status);return r.json();}
async function driveDownload(id){const r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:{Authorization:'Bearer '+accessToken}});if(!r.ok)throw new Error('下載失敗 '+r.status);return r.arrayBuffer();}
async function getFileId(folderId,name){const k=folderId+'/'+name;if(fileCache[k])return fileCache[k];const r=await driveQuery("name='"+name+"' and '"+folderId+"' in parents and trashed=false");if(!r.files.length)throw new Error(name+' 找不到');fileCache[k]=r.files[0].id;return r.files[0].id;}

// ── Init ──
async function initApp(){
  showLoading('初始化 SQLite…');
  try{
    const SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/'+f});
    setLoadMsg('下載 kbar.db…');
    const dbBuf=await driveDownload(await getFileId(FOLDER_IDS.kbar,'kbar.db'));
    sqlDb=new SQL.Database(new Uint8Array(dbBuf));
    setLoadMsg('讀取 behavior_state…');
    const behBuf=await driveDownload(await getFileId(FOLDER_IDS.structure,'behavior_state.json'));
    behaviorState=JSON.parse(new TextDecoder().decode(behBuf));
    setLoadMsg('讀取 settings…');
    await loadSettings();
    populateSel();
    hideLoading();
  }catch(e){hideLoading();setStatus('初始化失敗: '+e.message,true);console.error(e);}
}

// 股票名稱對照表
let stockNames={};

async function loadStockNames(){
  try{
    // stock_id.xlsx 在 KBar 資料夾
    const fid=await getFileId(FOLDER_IDS.kbar,'stock_id.xlsx');
    const buf=await driveDownload(fid);
    // 用 SheetJS 解析 xlsx
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    // A欄=公司代號, B欄=公司名稱, 第1行是標題跳過
    rows.slice(1).forEach(row=>{
      if(!row[0])return;
      const sym=String(row[0]).trim();
      const fullName=String(row[1]||'').trim();
      // 取前4個字（通常足以識別公司）
      const name=fullName.slice(0,4);
      if(sym&&name)stockNames[sym]=name;
    });
    console.log('股票名稱載入完成，共',Object.keys(stockNames).length,'筆');
  }catch(e){
    console.warn('stock_id.xlsx 載入失敗:',e.message);
  }
}

async function loadSettings(){
  const r=await driveQuery("name='settings' and mimeType='application/vnd.google-apps.folder' and '"+FOLDER_IDS.structure+"' in parents and trashed=false");
  if(!r.files.length)throw new Error('找不到 settings 資料夾');
  const fid=r.files[0].id;
  const fr=await driveQuery("'"+fid+"' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'");
  await Promise.all(fr.files.filter(f=>f.name.endsWith('.json')&&f.name!='__recent__.json').map(async f=>{
    const buf=await driveDownload(f.id);
    const sym=f.name.replace('.json','');
    try{settingsAll[sym]=JSON.parse(new TextDecoder().decode(buf));}catch(e){}
  }));
}

function populateSel(){
  const sel=document.getElementById('sym-select');
  Object.keys(settingsAll).sort().forEach(sym=>{
    const beh=behaviorState[sym]||{};
    const bd=(beh._meta||{}).best_div||'';
    const name=stockNames[sym]||'';
    const o=document.createElement('option');
    o.value=sym;
    o.textContent=sym+(name?' '+name:'')+(bd?' ('+bd+'等份)':'');
    sel.appendChild(o);
  });
}

function onSymbolChange(){currentSymbol=document.getElementById('sym-select').value;}
async function loadSymbol(){
  const sym=document.getElementById('sym-select').value;
  if(!sym){setStatus('請選擇股票',true);return;}
  currentSymbol=sym;await renderAll();
}
function switchTF(tf){
  currentTF=tf;
  document.querySelectorAll('.tf-tab').forEach((t,i)=>t.classList.toggle('active',['1D','30min','5min'][i]===tf));
  if(currentSymbol)renderAll();
}

async function renderAll(){
  if(!currentSymbol||!sqlDb)return;
  showLoading('繪製中…');
  try{
    const lp=getLastPrice(currentSymbol);
    if(lp!=null){document.getElementById('price-value').textContent=fmt(lp);document.getElementById('price-display').style.display='flex';}
    renderBehBar(currentSymbol);
    await renderCharts(currentSymbol);
    document.getElementById('behavior-bar').style.display='block';
    document.getElementById('chart-area').style.display='block';
    hideLoading();
    setStatus(currentSymbol+'  '+currentTF+'  '+new Date().toLocaleTimeString('zh-TW'));
  }catch(e){hideLoading();setStatus('繪製失敗: '+e.message,true);console.error(e);}
}

// ── 行為列 ──
// findLayerValue：從格線層找最接近 approx_dn 的格線實際 value
function findLayerValue(layer, approxDn){
  if(!layer||approxDn==null)return null;
  let best=null,bestDiff=Infinity;
  layer.forEach(item=>{
    if(item.approx_dn==null)return;
    const diff=Math.abs(item.approx_dn-parseFloat(approxDn));
    if(diff<bestDiff){bestDiff=diff;best=item.value;}
  });
  return best;
}
function renderBehBar(sym){
  const bar=document.getElementById('behavior-bar');
  const sb=behaviorState[sym]||{};
  const bd=(sb._meta||{}).best_div||'16';
  // 建格線層供反查 current_line 實際值
  const s=settingsAll[sym]||{};
  const gh=parseFloat(s.g0_high),gl=parseFloat(s.g0_low);
  let layerT=null,layerS=null;
  if(gh&&gl){
    const struct=calcStruct(gh,gl,parseInt(bd));
    layerT=struct.sub3;layerS=struct.sub6;
  }
  function cell(beh,layer){
    const cl=beh.current_line||'—',nu=beh.next_up||'',nd=beh.next_dn||'';
    const nuV=beh.next_up_value,nuU=beh.next_up_approx_up,nuD=beh.next_up_approx_dn;
    const ndV=beh.next_dn_value,ndU=beh.next_dn_approx_up,ndD=beh.next_dn_approx_dn;
    const caU=beh.current_approx_up,caD=beh.current_approx_dn;
    const le=beh.last_event||'',leb=beh.last_event_bar?beh.last_event_bar.slice(11,16):'';
    // current_line 實際值：從格線層反查 approx_dn 對應的 value
    const clV=findLayerValue(layer,caD);
    let clStr='';
    if(clV!=null) clStr=' <span style="color:#1565c0;font-weight:700;font-size:13px">'+fmt(clV)+'</span>';
    let clApprox='';
    if(caU!=null&&caD!=null) clApprox=' <span class="beh-price">('+fmt(caU)+' '+fmt(caD)+')</span>';
    let h='<span class="beh-curr-label">當前</span> <span class="beh-curr-line">'+cl+'</span>'+clStr+clApprox+'<br>';
    // 目的：name value (approx_up approx_dn)
    if(nu){
      const vStr=nuV!=null?' <span style="font-weight:700;font-size:13px;color:#333">'+fmt(nuV)+'</span>':'';
      const p=(nuU!=null&&nuD!=null)?'<span class="beh-price">('+fmt(nuU)+' '+fmt(nuD)+')</span>':'';
      h+='<span class="beh-up">'+nu+'</span>'+vStr+' '+p+'<br>';
    }
    if(nd){
      const vStr=ndV!=null?' <span style="font-weight:700;font-size:13px;color:#333">'+fmt(ndV)+'</span>':'';
      const p=(ndU!=null&&ndD!=null)?'<span class="beh-price">('+fmt(ndU)+' '+fmt(ndD)+')</span>':'';
      h+='<span class="beh-dn">'+nd+'</span>'+vStr+' '+p+'<br>';
    }
    if(le)h+='<span class="beh-curr-label">上次</span> <span class="beh-last">'+le+'</span>'+(leb?' <span class="beh-price">'+leb+'</span>':'');
    return h;
  }
  const tBeh=sb['g0_d'+bd+'_T']||{},sBeh=sb['g0_d'+bd+'_S']||{};
  bar.innerHTML='<table class="beh-table"><thead><tr><th class="th-t">T'+bd+'</th><th class="th-s">S'+bd+'</th></tr></thead><tbody><tr><td>'+cell(tBeh,layerT)+'</td><td>'+cell(sBeh,layerS)+'</td></tr></tbody></table>';
}

// ── 現價 ──
function getLastPrice(sym){
  if(!sqlDb)return null;
  try{
    // 優先讀 1分K 最後一根
    let r=sqlDb.exec('SELECT Close FROM kbar_1min WHERE symbol=? ORDER BY ts DESC LIMIT 1',[sym]);
    if(r.length&&r[0].values.length)return r[0].values[0][0];
    r=sqlDb.exec('SELECT Close FROM kbar_daily WHERE symbol=? ORDER BY ts DESC LIMIT 1',[sym]);
    return r.length&&r[0].values.length?r[0].values[0][0]:null;
  }catch(e){return null;}
}

// ── K棒查詢 ──
// kbar_1min 欄位：symbol, ts, Open, High, Low, Close, Volume（大寫）
function queryBars(sym,tf){
  try{
    if(tf==='5min'||tf==='30min'){
      const n=tf==='5min'?5:30;
      const r=sqlDb.exec('SELECT ts,Open,High,Low,Close,Volume FROM kbar_1min WHERE symbol=? ORDER BY ts ASC',[sym]);
      if(!r.length||!r[0].values.length)return[];
      const raw=r[0].values.map(v=>({ts:v[0],open:v[1],high:v[2],low:v[3],close:v[4],volume:v[5]}));
      return resampleNmin(raw,n).slice(-(tf==='5min'?160:120));
    }
    // 日K
    const r=sqlDb.exec('SELECT ts,Open,High,Low,Close,Volume FROM kbar_daily WHERE symbol=? ORDER BY ts DESC LIMIT 120',[sym]);
    if(!r.length)return[];
    return r[0].values.map(v=>({ts:v[0],open:v[1],high:v[2],low:v[3],close:v[4],volume:v[5]})).reverse();
  }catch(e){console.error('queryBars',e);return[];}
}

// N分K resample（closed=right, label=right，台股標準）
// 09:05 包含 09:01~09:05；09:10 包含 09:06~09:10
function resampleNmin(bars,n){
  const bk={};
  bars.forEach(b=>{
    const d=new Date(b.ts);
    const mins=d.getMinutes();
    // ceil(mins/n)*n：mins=5,n=5 → 5；mins=6,n=5 → 10
    const rm=mins===0?0:Math.ceil(mins/n)*n;
    const al=new Date(d);
    if(rm>=60){al.setHours(d.getHours()+1);al.setMinutes(rm-60);}
    else al.setMinutes(rm);
    al.setSeconds(0);al.setMilliseconds(0);
    const k=al.toISOString();
    if(!bk[k])bk[k]={ts:b.ts,open:b.open,high:b.high,low:b.low,close:b.close,volume:b.volume,_k:k};
    else{bk[k].high=Math.max(bk[k].high,b.high);bk[k].low=Math.min(bk[k].low,b.low);bk[k].close=b.close;bk[k].volume+=b.volume;}
  });
  return Object.values(bk).sort((a,b)=>a._k.localeCompare(b._k)).filter(b=>b.volume>0);
}

// ── 格線計算 ──
// ── round_down：完整移植自 round_down.py ──
function roundDown(v) {
  const orig=parseFloat(v);
  const s=orig.toFixed(10).replace(/0+$/,'');
  const parts=s.split('.');
  const intPart=parts[0];
  let dec=(parts[1]||'00').padEnd(2,'0').slice(0,2);
  const c10=parseInt(dec[0]),c11=parseInt(dec[1]);
  const dollars=parseInt(intPart);
  function p1(){let d=dollars,t=c10,e=c11;if(e<3)e=0;else if(e<8)e=5;else{if(t<9){e=0;t++;}else{e=0;t=0;d++;}}return parseFloat(d+'.'+t+e);}
  function pXY(){let d=dollars,t=c10,e=c11;if(t%2===0&&e>=6){e=0;if(t<9)t++;else{t=0;d++;}}else if(t%2===0&&e<6){e=0;}else if(t%2!==0&&e>=5){e=0;if(t<9)t++;else{t=0;d++;}}else if(t%2!==0&&e<5){e=0;}return d+'.'+t+e;}
  function p2(str){const pp=str.split('.');let d=parseInt(pp[0]),t=parseInt((pp[1]||'0')[0]);if(t<3)t=0;else if(t>=8){d++;t=0;}else t=5;return parseFloat(d+'.'+t);}
  if(orig<10)return orig;
  if(orig<50)return p1();
  if(orig<100)return parseFloat(pXY());
  if(orig<500)return p2(pXY());
  return p2(orig.toString());
}
// pyRound2：完整模擬 Python round(v, 2) 行為
// 包含 banker's rounding 和浮點儲存的精確處理
// 使用 toPrecision(17) 取得 IEEE 754 實際值的字串，再從字串做四捨五入
function pyRound2(v) {
  const s=v.toPrecision(17);
  const dot=s.indexOf('.');
  if(dot===-1)return parseFloat(parseFloat(s).toFixed(2));
  const intStr=s.slice(0,dot),decStr=s.slice(dot+1);
  const d1=parseInt(decStr[0]||'0'),d2=parseInt(decStr[1]||'0'),d3=parseInt(decStr[2]||'0');
  let c1=d1,c2=d2,intVal=parseInt(intStr);
  if(d3>5){c2++;if(c2>=10){c2=0;c1++;}if(c1>=10){c1=0;intVal++;}}
  else if(d3===5){
    const rest=decStr.slice(3).split('').some(ch=>ch!=='0');
    if(rest){c2++;if(c2>=10){c2=0;c1++;}if(c1>=10){c1=0;intVal++;}}
    else if(c2%2!==0){c2++;if(c2>=10){c2=0;c1++;}if(c1>=10){c1=0;intVal++;}}
  }
  return parseFloat(intVal+'.'+c1+c2);
}
// rd = 先 pyRound2（四捨五入到2位），再 roundDown（你的進位規則）
function rd(v){return roundDown(pyRound2(parseFloat(v)));}
function aUp(lo,hi){return rd(hi-(hi-lo)*APPROX_RATIO);}
function aDn(lo,hi){return rd(lo+(hi-lo)*APPROX_RATIO);}
function buildLayer(lo,hi,n){
  const step=(hi-lo)/n,items=[];
  for(let i=0;i<=n;i++)items.push({value:rd(lo+step*i),index:i,approx_up:null,approx_dn:null});
  for(let j=0;j<items.length-1;j++){items[j].approx_up=aUp(items[j].value,items[j+1].value);items[j+1].approx_dn=aDn(items[j].value,items[j+1].value);}
  return items;
}
function calcStruct(hi,lo,div){
  if(hi<=lo)return{main:[],sub3:[],sub6:[]};
  return{main:buildLayer(lo,hi,div),sub3:buildLayer(lo,hi,div*3),sub6:buildLayer(lo,hi,div*6)};
}
function buildGridLines(gh,gl,div,layer){
  const pr=gh-gl,tol=pr*0.0001;
  const half=gl+pr/2,t1=gl+pr/3,t2=gl+pr*2/3;
  return layer.map(item=>{
    const p=item.value;
    let color='rgba(180,180,180,0.35)',width=1,dash=[2,3];
    const isHalf=Math.abs(p-half)<tol,isThird=Math.abs(p-t1)<tol||Math.abs(p-t2)<tol;
    const isEdge=p===rd(gh)||p===rd(gl);
    if(isHalf){color='rgba(180,30,30,0.75)';width=1.5;dash=[];}
    else if(isThird){color='rgba(80,80,80,0.8)';width=1.2;dash=[];}
    else if(isEdge){color='rgba(160,160,160,0.6)';width=1;dash=[];}
    return{price:p,color,width,dash,isHalf,isEdge:isEdge||isThird};
  });
}

// ── 圖表 ──
async function renderCharts(sym){
  chartInst.forEach(c=>c.destroy());chartInst=[];
  const area=document.getElementById('chart-area');area.innerHTML='';
  const s=settingsAll[sym]||{};
  const gh=parseFloat(s.g0_high),gl=parseFloat(s.g0_low);
  if(!gh||!gl){setStatus(sym+' 無 High/Low',true);return;}
  const bars=queryBars(sym,currentTF);
  if(!bars.length){setStatus(sym+' 無K棒資料');return;}
  const sb=behaviorState[sym]||{};
  const bd=(sb._meta||{}).best_div||'16';
  for(const div of[12,16]){
    const struct=calcStruct(gh,gl,div);
    for(const zt of['T','S']){
      const layer=zt==='T'?struct.sub3:struct.sub6;
      const bkey='g0_d'+div+'_'+zt;
      const beh=sb[bkey]||{};
      const gridLines=buildGridLines(gh,gl,div,layer);
      const card=buildCard(sym,div,zt,bars,gridLines,beh,String(div)===String(bd),layer);
      area.appendChild(card);
    }
  }
}

function buildCard(sym,div,zt,bars,gl,beh,isBest,_layer){
  const el=document.createElement('div');el.className='chart-card';
  const dir=beh.zone_direction||'';
  const ds=dir==='up'?'▲':dir==='down'?'▼':'';
  const star=isBest?' ★':'';
  el.innerHTML='<div class="chart-title"><span>'+sym+'  '+div+'等份  <span class="zone-'+(zt==='T'?'t':'s')+'">'+zt+'</span>'+star+'</span><span>'+ds+' '+(beh.current_line||'')+'</span></div><div class="chart-body"><div class="chart-inner"><canvas></canvas></div><div class="price-axis"></div></div>';
  setTimeout(()=>{
    const canvas=el.querySelector('canvas');
    if(!canvas)return;
    const chart=buildChart(canvas,bars,gl,beh,_layer);
    chartInst.push(chart);
    setTimeout(()=>fillAxis(el,chart,gl,beh),100);
  },0);
  return el;
}

function buildChart(canvas,bars,gridLines,beh,layer){
  const ctx=canvas.getContext('2d');
  const allH=Math.max(...bars.map(b=>b.high)),allL=Math.min(...bars.map(b=>b.low));
  const pad=(allH-allL)*0.08;
  const labels=bars.map(b=>{
    const d=new Date(b.ts);
    if(currentTF==='1D')return(d.getMonth()+1)+'/'+(d.getDate());
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  });
  const gridPlugin={id:'gl',afterDraw(chart){
    const{ctx,chartArea,scales}=chart;const y=scales.y;
    ctx.save();
    gridLines.forEach(g=>{
      const py=y.getPixelForValue(g.price);
      if(py<chartArea.top||py>chartArea.bottom)return;
      ctx.beginPath();ctx.moveTo(chartArea.left,py);ctx.lineTo(chartArea.right,py);
      ctx.strokeStyle=g.color;ctx.lineWidth=g.width;ctx.setLineDash(g.dash);ctx.stroke();ctx.setLineDash([]);
    });
    // 目標線：用實際值（next_up_value / next_dn_value）定位，與右側價格欄一致
    const tUpV=beh.next_up_value,tDnV=beh.next_dn_value;
    const tUpAU=beh.next_up_approx_up,tUpAD=beh.next_up_approx_dn;
    const tDnAU=beh.next_dn_approx_up,tDnAD=beh.next_dn_approx_dn;
    [[tUpV,'#e65100',beh.next_up,tUpAU,tUpAD],[tDnV,'#1b5e20',beh.next_dn,tDnAU,tDnAD]].forEach(([price,color,name,aU,aD])=>{
      if(price==null)return;
      const py=y.getPixelForValue(price);
      if(py<chartArea.top||py>chartArea.bottom)return;
      ctx.beginPath();ctx.moveTo(chartArea.left,py);ctx.lineTo(chartArea.right,py);
      ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([6,3]);ctx.stroke();ctx.setLineDash([]);
      if(name){
        // 標籤：名稱 + 實際值 + 近似值
        const valStr=' '+fmt(price);
        const approxStr=(aU!=null&&aD!=null)?(' ('+fmt(aU)+' '+fmt(aD)+')'):'';
        const fullLabel=name+valStr+approxStr;
        ctx.font='bold 11px sans-serif';
        const tw=ctx.measureText(fullLabel).width;
        ctx.fillStyle=color==='#e65100'?'#fff3e0':'#f1f8e9';
        ctx.fillRect(chartArea.left+4,py-14,tw+10,14);
        ctx.strokeStyle=color;ctx.lineWidth=1;
        ctx.strokeRect(chartArea.left+4,py-14,tw+10,14);
        ctx.fillStyle=color;ctx.textAlign='left';
        ctx.fillText(fullLabel,chartArea.left+8,py-3);
      }
    });
    // current_line 黑色虛線，靠左標籤：「L7 80.6 (81.2 80)」
    const caDn=beh.current_approx_dn,caUp=beh.current_approx_up,cl=beh.current_line;
    if(cl&&caDn!=null&&caUp!=null){
      // 從完整 layer 精確反查 current_approx_dn 對應的格線 value
      // layer 是 Python 算的原始結構，approx_dn 比對最精確
      let clActual=null;
      if(layer&&layer.length){
        let bestDiff=Infinity;
        layer.forEach(item=>{
          if(item.approx_dn==null)return;
          const diff=Math.abs(item.approx_dn-parseFloat(caDn));
          if(diff<bestDiff){bestDiff=diff;clActual=item.value;}
        });
      }
      // fallback：從 gridLines 找最近的
      if(clActual==null){
        let bestDiff=Infinity;
        const mid=(parseFloat(caUp)+parseFloat(caDn))/2;
        gridLines.forEach(g=>{
          const diff=Math.abs(g.price-mid);
          if(diff<bestDiff){bestDiff=diff;clActual=g.price;}
        });
      }
      const clPrice=clActual!=null?clActual:(parseFloat(caDn)+parseFloat(caUp))/2;
      const py=y.getPixelForValue(clPrice);
      if(py>=chartArea.top&&py<=chartArea.bottom){
        ctx.beginPath();ctx.moveTo(chartArea.left,py);ctx.lineTo(chartArea.right,py);
        ctx.strokeStyle='#222';ctx.lineWidth=1.5;ctx.setLineDash([8,4]);ctx.stroke();ctx.setLineDash([]);
        const valStr=clActual!=null?(' '+fmt(clActual)):'';
        const approxStr='('+fmt(caUp)+' '+fmt(caDn)+')';
        const fullCL=cl+valStr+' '+approxStr;
        ctx.font='bold 11px sans-serif';
        const tw=ctx.measureText(fullCL).width;
        ctx.fillStyle='#f5f5f5';
        ctx.fillRect(chartArea.left+4,py-14,tw+10,14);
        ctx.strokeStyle='#444';ctx.lineWidth=1;
        ctx.strokeRect(chartArea.left+4,py-14,tw+10,14);
        ctx.fillStyle='#111';ctx.textAlign='left';
        ctx.fillText(fullCL,chartArea.left+8,py-3);
      }
    }
    ctx.restore();
  }};
  const candlePlugin={id:'cd',afterDatasetsDraw(chart){
    const{ctx,chartArea,scales}=chart;
    const xs=scales.x,ys=scales.y;
    ctx.save();
    const bw=Math.max(2,(chartArea.width/bars.length)*0.6);
    bars.forEach((b,i)=>{
      const x=xs.getPixelForValue(i);
      const yO=ys.getPixelForValue(b.open),yC=ys.getPixelForValue(b.close);
      const yH=ys.getPixelForValue(b.high),yL=ys.getPixelForValue(b.low);
      const up=b.close>=b.open,c=up?'#c62828':'#2e7d32';
      ctx.beginPath();ctx.moveTo(x,yH);ctx.lineTo(x,yL);ctx.strokeStyle=c;ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle=c;ctx.fillRect(x-bw/2,Math.min(yO,yC),bw,Math.max(1,Math.abs(yO-yC)));
    });
    ctx.restore();
  }};
  return new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{data:bars.map(b=>(b.high+b.low)/2),borderColor:'transparent',pointRadius:0,fill:false}]},
    options:{
      animation:false,responsive:true,maintainAspectRatio:false,
      layout:{padding:{right:4}},
      scales:{
        x:{ticks:{color:'#555',font:{size:10},maxTicksLimit:8},grid:{color:'#e8eaf0'}},
        y:{display:false,min:allL-pad,max:allH+pad,grid:{color:'#e8eaf0'}}
      },
      plugins:{legend:{display:false},tooltip:{enabled:false}}
    },
    plugins:[gridPlugin,candlePlugin]
  });
}

function fillAxis(cardEl,chart,gridLines,beh){
  const ax=cardEl.querySelector('.price-axis');
  if(!ax||!chart||!chart.scales||!chart.scales.y||!chart.chartArea)return;
  const ys=chart.scales.y,minY=ys.min,maxY=ys.max,range=maxY-minY;
  if(!range)return;

  // 關鍵：用 Chart.js chartArea 的實際繪圖區域對齊
  // chartArea.top = Canvas 內繪圖區頂端（px），chartArea.height = 繪圖區高度
  // price-axis 的 top 偏移 = chartArea.top + (price 比例 * chartArea.height)
  const ca=chart.chartArea;
  const canvasH=chart.canvas.offsetHeight||340;
  const areaTop=ca.top;       // 繪圖區頂端距 canvas 頂端的 px
  const areaH=ca.height;      // 繪圖區實際高度

  const ticks=[];const seen=new Set();
  const pr=Math.max(...gridLines.map(g=>g.price))-Math.min(...gridLines.map(g=>g.price));
  const half=Math.min(...gridLines.map(g=>g.price))+pr/2,tol=pr*0.001;

  gridLines.forEach(g=>{
    if(g.price<minY||g.price>maxY)return;
    const isH=Math.abs(g.price-half)<tol;
    const isSolid=Array.isArray(g.dash)&&g.dash.length===0;
    ticks.push({price:g.price,cls:'tick'+(isH?' half':isSolid?' edge':'')});
  });
  // behavior_state 實際值也加入
  [beh.next_up_value,beh.next_dn_value].forEach(v=>{
    if(v==null)return;
    const p=parseFloat(v);
    if(p>=minY&&p<=maxY)ticks.push({price:p,cls:'tick'});
  });

  const sorted=ticks.filter(t=>{
    const k=parseFloat(t.price).toFixed(2);
    if(seen.has(k))return false;seen.add(k);return true;
  }).sort((a,b)=>b.price-a.price);

  ax.innerHTML='';
  sorted.forEach(t=>{
    // 用和 Chart.js gridPlugin 完全相同的公式計算 Y 位置
    const pct=(maxY-t.price)/range;
    const topInCanvas=areaTop+pct*areaH;  // 在 canvas 內的 px 位置
    const d=document.createElement('div');d.className=t.cls;
    d.style.top=topInCanvas+'px';          // price-axis 和 canvas 等高，位置直接對應
    d.textContent=parseFloat(t.price).toFixed(1);
    ax.appendChild(d);
  });
}

function fmt(v){if(v==null)return'—';const f=parseFloat(v);return f===Math.floor(f)?f.toFixed(0):f.toFixed(1);}
function setStatus(msg,err){const e=document.getElementById('status-bar');e.textContent=msg;e.className=err?'err':'';}
function showLoading(msg){document.getElementById('loading').classList.add('show');setLoadMsg(msg);}
function setLoadMsg(msg){document.getElementById('loading-msg').textContent=msg;}
function hideLoading(){document.getElementById('loading').classList.remove('show');}
loadGIS();
</script>
